# values-dev.yaml - Otimizado para desenvolvimento local
# Configuração leve para testes e demonstrações

namespace: mamaloo-dev
replicaCount: 1

# Backend para desenvolvimento
backend:
  image:
    repository: ghcr.io/analarie/portal-mamaloo-backend
    tag: "dev-d0ae34f"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8025
    targetPort: 8025
  replicas: 1
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: DEBUG
      value: "true"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  healthcheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Rollout BlueGreen para DEV
  rollout:
    enabled: true
    strategy: "blueGreen"
    blueGreen:
      autoPromotionEnabled: false  # Promoção manual
      scaleDownDelaySeconds: 30

# Frontend para desenvolvimento
frontend:
  image:
    repository: ghcr.io/analarie/portal-mamaloo-frontend
    tag: "prod-6c56464"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 5185
  replicas: 1
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  healthcheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Rollout BlueGreen para DEV
  rollout:
    enabled: true
    strategy: "blueGreen"
    blueGreen:
      autoPromotionEnabled: false  # Promoção manual
      scaleDownDelaySeconds: 30

# Database para desenvolvimento
database:
  enabled: true
  user: mamaloo_dev_user
  password: "DevPass2024!Secure"
  database: mamaloo_dev
  port: 5432
  image: postgres:15-alpine
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard

# Ingress 
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: mamaloo-dev.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    enabled: false

# Autoscaling desativado para dev
autoscaling:
  enabled: false

# Migrations habilitadas para dev
migrations:
  enabled: true
  backoffLimit: 1

