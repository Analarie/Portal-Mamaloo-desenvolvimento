# values-dev.yaml
# Overrides para ambiente de desenvolvimento

# Namespace dedicado para dev
namespace: mamaloo-dev

# Uma única réplica para dev
replicaCount: 1

# Backend para desenvolvimento
backend:
  image:
    tag: "dev"
  replicas: 1
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: DEBUG
      value: "true"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Frontend para desenvolvimento
frontend:
  image:
    tag: "dev"
  replicas: 1
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Database para desenvolvimento
database:
  password: "dev-password-123"
  database: mamaloo_dev
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard

# Ingress para desenvolvimento
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: mamaloo-dev.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    enabled: false

# Autoscaling desativado para dev
autoscaling:
  enabled: false

# Migrations habilitadas para dev
migrations:
  enabled: true
  backoffLimit: 1

