# values-prod.yaml - Simplificado para aplicação básica
# Configuração otimizada para Portal Mamaloo

namespace: mamaloo-prod

# 1 réplica por serviço (suficiente para demonstração)
replicaCount: 1

# Backend
backend:
  image:
    repository: ghcr.io/analarie/portal-mamaloo-backend
    tag: "prod"
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    - name: ENVIRONMENT
      value: "production"
    - name: DEBUG
      value: "false"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

# Frontend
frontend:
  image:
    repository: ghcr.io/analarie/portal-mamaloo-frontend
    tag: "prod"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Database
database:
  enabled: true
  user: mamaloo_prod_user
  password: "Pr0dPassw0rdSecur3Mamal00"
  database: mamaloo_prod
  port: 5432
  image: postgres:15-alpine
  persistence:
    enabled: true
    size: 20Gi  # Mantido em 20Gi (volumeClaimTemplates é imutável)
    storageClass: standard

# Ingress simplificado (sem TLS)
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: mamaloo.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    enabled: false

# Autoscaling desabilitado
autoscaling:
  enabled: false

# Migrations
migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600

# Pod Disruption Budget desabilitado
podDisruptionBudget:
  enabled: false
