# values-prod.yaml
# Overrides para ambiente de produção

# Namespace dedicado para prod
namespace: mamaloo-prod

# Múltiplas réplicas para alta disponibilidade
replicaCount: 3

# Backend para produção
backend:
  image:
    tag: "prod"
  replicas: 3
  env:
    - name: ENVIRONMENT
      value: "production"
    - name: DEBUG
      value: "false"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Frontend para produção
frontend:
  image:
    tag: "prod"
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Database para produção
database:
  user: postgres
  password: "${DB_PASSWORD}"  # Use secret ou secret management
  database: mamaloo_prod
  port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard

# Ingress para produção com TLS
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: mamaloo.com.br
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    enabled: true
    secretName: mamaloo-tls-prod

# Autoscaling habilitado para prod
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Migrations habilitadas para prod
migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 1200

# Pod Disruption Budget para alta disponibilidade
podDisruptionBudget:
  enabled: true
  minAvailable: 2

