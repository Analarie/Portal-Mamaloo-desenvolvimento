name: CI/CD Pipeline - Portal Mamaloo

on:
  push:
    branches: [main, desenvolvimento]
    paths-ignore:
      - 'helm/mamaloo-app/values-*.yaml'
      - 'helm/mamaloo-app/Chart.yaml'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: Detect changes
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend/**'
  
  build-and-push:
    needs: check-changes
    if: needs.check-changes.outputs.backend-changed == 'true' || needs.check-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.meta.outputs.env }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
    
    - name: Log in to GHCR
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.PAT_TOKEN }}
    
    - name: Set lowercase owner
      id: lowercase
      run: |
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT
    
    - name: Generate image metadata
      id: meta
      run: |
        SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
        BRANCH=${GITHUB_REF#refs/heads/}
        
        if [ "$BRANCH" = "main" ]; then
          TAG="prod-${SHA_SHORT}"
          ENV="prod"
        else
          TAG="dev-${SHA_SHORT}"
          ENV="dev"
        fi
        
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "env=${ENV}" >> $GITHUB_OUTPUT
        echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
    
    - name: Build and push backend
      if: needs.check-changes.outputs.backend-changed == 'true'
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    - name: Build and push frontend
      if: needs.check-changes.outputs.frontend-changed == 'true'
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: ./frontend
        file: ./frontend/${{ steps.meta.outputs.env == 'prod' && 'Dockerfile.prod' || 'Dockerfile' }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
  
  update-helm-tags:
    needs: [check-changes, build-and-push]
    if: github.event_name == 'push' && (needs.check-changes.outputs.backend-changed == 'true' || needs.check-changes.outputs.frontend-changed == 'true')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
      with:
        python-version: '3.x'
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Run external update script
      run: |
        TAG="${{ needs.build-and-push.outputs.image-tag }}"
        ENV="${{ needs.build-and-push.outputs.env }}"
        
        ARGS="--tag ${TAG} --environment ${ENV}"
        
        if [ "${{ needs.check-changes.outputs.backend-changed }}" = "true" ]; then
          ARGS="${ARGS} --backend"
        fi
        
        if [ "${{ needs.check-changes.outputs.frontend-changed }}" = "true" ]; then
          ARGS="${ARGS} --frontend"
        fi
        
        echo "Executing: python scripts/update-image-tags.py ${ARGS}"
        python scripts/update-image-tags.py ${ARGS}
    
    - name: Commit and push tag updates
      run: |
        VALUES_FILE="helm/mamaloo-app/values-${{ needs.build-and-push.outputs.env }}.yaml"
        
        git add "${VALUES_FILE}"
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update image tags to ${{ needs.build-and-push.outputs.image-tag }} [skip ci]"
          git push
          echo "✅ Tags updated successfully!"
        fi
