name: CI/CD Pipeline - Portal Mamaloo

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/portal-mamaloo
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Detect changes
      uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend/**'
  
  build-and-push:
    needs: check-changes
    if: needs.check-changes.outputs.backend-changed == 'true' || needs.check-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set lowercase owner
      id: lowercase
      run: |
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT
        echo "📦 Using registry: ${{ env.REGISTRY }}/${OWNER_LC}"
    
    - name: Generate image metadata
      id: meta
      run: |
        SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
        BRANCH=${GITHUB_REF#refs/heads/}
        
        if [ "$BRANCH" = "main" ]; then
          TAG="prod-${SHA_SHORT}"
          ENV="prod"
        else
          TAG="dev-${SHA_SHORT}"
          ENV="dev"
        fi
        
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "env=${ENV}" >> $GITHUB_OUTPUT
        echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
        
        echo "📦 Building images with tag: ${TAG}"
    
    - name: Build and push backend
      if: needs.check-changes.outputs.backend-changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    - name: Build and push frontend
      if: needs.check-changes.outputs.frontend-changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
  
  update-gitops-repo:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout argocd-gitops repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/argocd-gitops
        token: ${{ secrets.GITOPS_PAT }}
        path: gitops
    
    - name: Update image tags in gitops repo
      run: |
        TAG="${{ needs.build-and-push.outputs.image-tag }}"
        ENV="${{ needs.build-and-push.outputs.env }}"
        
        cd gitops
        
        # Atualizar values override ou kustomization
        if [ -f "apps/mamaloo-${ENV}/values-override.yaml" ]; then
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|g" "apps/mamaloo-${ENV}/values-override.yaml"
        fi
        
        echo "✓ Updated gitops repo with tag: ${TAG}"
    
    - name: Commit and push to gitops
      run: |
        cd gitops
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore(mamaloo): update images to ${{ needs.build-and-push.outputs.image-tag }}"
          git push
          echo "✅ GitOps repository updated successfully"
        fi
  
  notify:
    needs: [build-and-push, update-gitops-repo]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Build summary
      run: |
        echo "## 🚀 CI/CD Pipeline Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** \`${{ needs.build-and-push.outputs.env }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- ArgoCD will automatically sync the new images" >> $GITHUB_STEP_SUMMARY
        echo "- Monitor deployment: \`kubectl get pods -n mamaloo-${{ needs.build-and-push.outputs.env }}\`" >> $GITHUB_STEP_SUMMARY
