name: CI/CD Pipeline - Portal Mamaloo

on:
  push:
    branches: [main, desenvolvimento]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: Detect changes
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend/**'
  
  build-and-push:
    needs: check-changes
    if: needs.check-changes.outputs.backend-changed == 'true' || needs.check-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.meta.outputs.env }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
    
    - name: Log in to GHCR
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.PAT_TOKEN }}
    
    - name: Set lowercase owner
      id: lowercase
      run: |
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT
    
    - name: Generate image metadata
      id: meta
      run: |
        SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
        BRANCH=${GITHUB_REF#refs/heads/}
        
        if [ "$BRANCH" = "main" ]; then
          TAG="prod-${SHA_SHORT}"
          ENV="prod"
        else
          TAG="dev-${SHA_SHORT}"
          ENV="dev"
        fi
        
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "env=${ENV}" >> $GITHUB_OUTPUT
        echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
    
    - name: Build and push backend
      if: needs.check-changes.outputs.backend-changed == 'true'
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    - name: Build and push frontend
      if: needs.check-changes.outputs.frontend-changed == 'true'
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
  
  update-gitops-repo:
    needs: [check-changes, build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/desenvolvimento') && (needs.check-changes.outputs.backend-changed == 'true' || needs.check-changes.outputs.frontend-changed == 'true')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Update image tags in prod environment
      run: |
        TAG="${{ needs.build-and-push.outputs.image-tag }}"
        BACKEND_CHANGED="${{ needs.check-changes.outputs.backend-changed }}"
        FRONTEND_CHANGED="${{ needs.check-changes.outputs.frontend-changed }}"
        
        # Configurar Git
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Exportar variáveis para Python
        export TAG
        export BACKEND_CHANGED
        export FRONTEND_CHANGED
        
        # Script Python para atualizar tags nos arquivos YAML
        cat > update_tags.py << 'PYTHON_SCRIPT'
        import re
        import sys
        import os
        
        tag = os.environ.get('TAG')
        backend_changed = os.environ.get('BACKEND_CHANGED') == 'true'
        frontend_changed = os.environ.get('FRONTEND_CHANGED') == 'true'
        
        # Atualiza apenas values-prod.yaml
        values_files = ['helm/mamaloo-app/values-prod.yaml']
        files_updated = []
        
        for values_file in values_files:
            with open(values_file, 'r') as f:
                content = f.read()
            
            original_content = content
            
            if backend_changed:
                pattern = r'(backend:\s+image:\s+repository:[^\n]+\s+tag:\s+)"[^"]+"'
                content = re.sub(pattern, r'\1"' + tag + '"', content, flags=re.MULTILINE | re.DOTALL)
            
            if frontend_changed:
                pattern = r'(frontend:\s+image:\s+repository:[^\n]+\s+tag:\s+)"[^"]+"'
                content = re.sub(pattern, r'\1"' + tag + '"', content, flags=re.MULTILINE | re.DOTALL)
            
            if content != original_content:
                with open(values_file, 'w') as f:
                    f.write(content)
                files_updated.append(values_file)
        
        if files_updated:
            sys.exit(0)
        else:
            sys.exit(1)
        PYTHON_SCRIPT
        
        python3 update_tags.py
        
        # Commit e push das alterações
        if [ $? -eq 0 ]; then
          git add helm/mamaloo-app/values-prod.yaml
          git commit -m "chore: update image tags to ${TAG} in prod [skip ci]"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
        fi

