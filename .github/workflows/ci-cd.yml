name: CI/CD Pipeline - Portal Mamaloo

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/portal-mamaloo
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # Detecta quais componentes foram modificados (backend ou frontend)
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: Detect changes
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend/**'
  
  # Constroi e envia imagens Docker apenas dos componentes modificados
  build-and-push:
    needs: check-changes
    if: needs.check-changes.outputs.backend-changed == 'true' || needs.check-changes.outputs.frontend-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.meta.outputs.env }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
    
    - name: Log in to GHCR
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.PAT_TOKEN }}
    
    - name: Set lowercase owner
      id: lowercase
      run: |
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=${OWNER_LC}" >> $GITHUB_OUTPUT
    
    # Gerar tag baseada no commit 
    - name: Generate image metadata
      id: meta
      run: |
        SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
        BRANCH=${GITHUB_REF#refs/heads/}
        
        if [ "$BRANCH" = "main" ]; then
          TAG="prod-${SHA_SHORT}"
          ENV="prod"
        else
          TAG="dev-${SHA_SHORT}"
          ENV="dev"
        fi
        
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "env=${ENV}" >> $GITHUB_OUTPUT
        echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
    
    - name: Build and push backend
      if: needs.check-changes.outputs.backend-changed == 'true'
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-backend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    - name: Build and push frontend
      if: needs.check-changes.outputs.frontend-changed == 'true'
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.owner }}/portal-mamaloo-frontend:${{ steps.meta.outputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
  
  # Atualiza tags das imagens no repositorio Git (GitOps)
  update-gitops-repo:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Update image tags
      run: |
        TAG="${{ needs.build-and-push.outputs.image-tag }}"
        ENV="${{ needs.build-and-push.outputs.env }}"
        BACKEND_CHANGED="${{ needs.check-changes.outputs.backend-changed }}"
        FRONTEND_CHANGED="${{ needs.check-changes.outputs.frontend-changed }}"
        
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Seleciona arquivo values correto baseado no ambiente
        if [ "$ENV" = "prod" ]; then
          VALUES_FILE="helm/mamaloo-app/values-prod.yaml"
        else
          VALUES_FILE="helm/mamaloo-app/values-dev.yaml"
        fi
        
        # Atualiza apenas as tags dos componentes que mudaram
        if [ "$BACKEND_CHANGED" = "true" ]; then
          sed -i "/backend:/,/tag:/ s|tag: \".*\"|tag: \"${TAG}\"|" "$VALUES_FILE"
          echo "Updated backend tag to ${TAG}"
        fi
        
        if [ "$FRONTEND_CHANGED" = "true" ]; then
          sed -i "/frontend:/,/tag:/ s|tag: \".*\"|tag: \"${TAG}\"|" "$VALUES_FILE"
          echo "Updated frontend tag to ${TAG}"
        fi
        
        git add "$VALUES_FILE"
        git commit -m "chore: update image tags to ${TAG} [skip ci]"
        git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

